<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoScout AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            margin-top: 15px;
            border-radius: 12px;
        }

        .green {
            color: #22c55e;
        }

        .yellow {
            color: #facc15;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 CryptoScout AI</h1>

    <p>Crypto research and market analysis dashboard</p>

    <div class="card">
        <h2>📊 Market Overview</h2>
        <p>Bitcoin: <span class="green">Loading...</span></p>
        <p>Ethereum: <span class="green">Loading...</span></p>
    </div>

    <div class="card">
        <h2>🔥 Trending Opportunities</h2>
        <p>Crypto analysis coming soon...</p>
    </div>

    <div class="card">
        <h2>🎁 Airdrops</h2>
        <p>Upcoming airdrops coming soon...</p>
    </div>

    <div class="card">
        <h2>⚠️ Risk Scanner</h2>
        <p class="yellow">No projects analyzed yet.</p>
    </div>

</div>

</body>
</html>
